name: Bug report
description: Report a reproducible problem in rssnook
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Do not include secrets or personal feed data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Host environment
      options:
        - Linux
        - macOS
        - Windows with WSL2
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove URLs, tokens, article content, and other personal data before sharing.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
